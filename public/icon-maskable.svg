<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#141211"/>
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered scaled content within safe zone (80% circle) -->
  <g transform="translate(256, 235) scale(0.8)">
    <!-- Steam waves -->
    <path d="M-40 -105 C-45 -125 -25 -140 -35 -160 C-45 -175 -35 -190 -40 -205" fill="none" stroke="url(#goldGradMask)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M0 -115 C-5 -135 15 -150 5 -170 C-5 -185 5 -200 0 -215" fill="none" stroke="url(#goldGradMask)" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 -105 C35 -125 55 -140 45 -160 C35 -175 45 -190 40 -205" fill="none" stroke="url(#goldGradMask)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

    <!-- Cup Body -->
    <path d="M-90 -70 L90 -70 C90 -70 85 45 0 50 C-85 45 -90 -70 -90 -70 Z" fill="#1f1b18" stroke="url(#goldGradMask)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Cup Handle -->
    <path d="M85 -45 C125 -45 130 15 80 25" fill="none" stroke="url(#goldGradMask)" stroke-width="12" stroke-linecap="round"/>

    <!-- Coffee Saucer -->
    <path d="M-115 65 L115 65 C125 65 125 80 115 80 L-115 80 C-125 80 -125 65 -115 65 Z" fill="url(#goldGradMask)"/>

    <!-- Golden Bean Emblem in center of cup -->
    <ellipse cx="0" cy="-12" rx="28" ry="36" fill="url(#goldGradMask)" transform="rotate(-15)"/>
    <path d="M-5 -45 C12 -25 -12 5 5 20" fill="none" stroke="#1f1b18" stroke-width="6" stroke-linecap="round"/>

    <!-- Typography -->
    <text x="0" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="4">COFFUTINO</text>
    <text x="0" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#f59e0b" letter-spacing="6">SPECIALTY COFFEE</text>
  </g>
</svg>
